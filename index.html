<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Delicious Apples</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

  <div class="product-card">
    <div class="product-image">
      <img id="main-apple" src="apple-removebg-preview.png" alt="Delicious Apple">
    </div>
    
    <div class="product-details">
      <h2>Delicious Apples</h2>
      <p class="price">R$ <span>7.93</span></p>
      <p>1KG (4–6 Apples)</p>

      <div class="apple-types">
        <img src="apple-removebg-preview.png" >
        <img src="./red.jpg" alt="Red">
        <img src="./yelloe.jpg" alt="Yellow">
      </div>

      <ul>
        <li>Apples are nutritious</li>
        <li>May support weight loss</li>
        <li>Good for heart health</li>
        <li>Linked to lower diabetes risk</li>
      </ul>

      <button>Add to Cart</button>
    </div>
  </div>
</body>
</html>
